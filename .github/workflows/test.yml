name: test

on:
  push:
  pull_request:

jobs:
  constitutional-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run behavior, architecture, quality, and meta-test gates
        run: bash tests/verify.sh

      - name: Build release binaries
        run: cargo build --release --manifest-path daemon/Cargo.toml

  system-gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    needs: constitutional-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install tmux on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Run real tmux E2E, concurrency, memory, and chaos falsifiers
        run: bash tests/system.sh

  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: constitutional-gate
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned mutation tester
        run: cargo install cargo-mutants --version 27.1.0 --locked

      - name: Prove critical state and protocol tests kill every viable mutant
        run: bash tests/mutation.sh

      - name: Prove Bash behavior tests kill every reviewed fault
        run: bash tests/bash_mutation.sh

  security-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: constitutional-gate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned RustSec scanner
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Reject advisories and committed secret signatures
        run: bash tests/security.sh

  stability-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: constitutional-gate
    steps:
      - uses: actions/checkout@v4

      - name: Run every behavior test twenty consecutive times
        run: bash tests/flaky.sh

  performance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: constitutional-gate
    steps:
      - uses: actions/checkout@v4

      - name: Run strict p95 performance falsifier
        run: bash tests/perf_smoke.sh
